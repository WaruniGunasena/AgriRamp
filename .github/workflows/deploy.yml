name: Build and Push Docker Images (CI/CD)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------
  # Backend Build, Test & Push
  # -------------------------------------------------------------
  backend-ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Test Backend (.NET)
        run: |
          dotnet build ./AgriState_MiniTracker_backend/AgriState_MiniTracker/AgriState_MiniTracker.sln -c Release

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./AgriState_MiniTracker_backend
          file: ./AgriState_MiniTracker_backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agriramp-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agriramp-backend:${{ github.sha }}

  # -------------------------------------------------------------
  # Frontend Build & Push
  # -------------------------------------------------------------
  frontend-ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend (Vite)
        working-directory: ./AgriState_MiniTracker_frontend
        run: |
          npm ci
          npm run build

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./AgriState_MiniTracker_frontend
          file: ./AgriState_MiniTracker_frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agriramp-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agriramp-frontend:${{ github.sha }}
